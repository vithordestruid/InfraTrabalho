spring.application.name=sistema-ordem-servico

# Conexão com o PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ordemservicodb
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# Cria e atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Mostra a mensagem das regras de negocio (ex.: "Cliente possui ordens") no front
server.error.include-message=always
